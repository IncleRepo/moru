name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate package
        run: python scripts/validate_plugin.py .
      - name: Validate behavioral evaluation contract
        run: python scripts/validate_evals.py
      - name: Smoke test clean release archive
        run: python scripts/smoke_package.py .
